[application]
# name shown by dx tooling
name = "tafy-pwa"
default_platform = "web"

[web.app]
# SINGLE source of the page title: dx appends this into the static
# <title></title> in index.html (verified 2026-11-09 — any static
# text gets duplicated).
title = "tAfY"
# gh-pages PROJECT sites serve under a SUBPATH: set to the full
# deploy prefix, e.g. /some/page when the bundle lives in dir page/
# of repo some (URL https://<user>.github.io/some/page/).
# USER site (<user>.github.io) keeps "/" — one line either way.
base_path = "/tafy"

# pwa-static files live in public/ (copied verbatim): manifest,
# sw.js, pwa.js (SW registration), icons. index.html (crate root)
# carries the static head links. [pending: verify public/ copy at
# build — done 2026-11-09, see build log in coarse]
