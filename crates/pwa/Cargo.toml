[package]
name = "tafy-pwa"
version = "0.1.0-alpha"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Web-only wasm bin; built by `dx build` (wasm32-unknown-unknown).
[dependencies]
dioxus.workspace = true

# Browser single-instance guard (Web Locks). Versions pinned to what
# the graph already carries: wasm-bindgen MUST stay =0.2.130 to match
# the wasm-bindgen-cli build pin (see README.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.107", features = ["Window", "Navigator"] }
js-sys = "0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"

[features]
default = ["web"]
web = ["dioxus/web", "dioxus/router"]
